name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional:
    name: Conventional pull request title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if ! printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::The title does not follow Conventional Commits, for example 'feat(hl-tdd): add --watch'. The squashed commit uses it, and release-please reads that commit."
            exit 1
          fi
